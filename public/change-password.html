<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Change password &middot; ADOC Staff Portal</title>
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body>
<main class="narrow">
  <div id="logo" style="color:var(--ranger-green);width:260px;margin:0 auto 26px"></div>
  <div class="panel">
    <h1>Change password</h1>
    <p class="sub" id="intro">Choose a new password for your account.</p>
    <form id="f">
      <label for="current">Current (or temporary) password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
      <label for="next">New password</label>
      <input id="next" name="next" type="password" autocomplete="new-password" minlength="12" required>
      <div class="hint">At least 12 characters. A few random words works well.</div>
      <label for="again">New password again</label>
      <input id="again" name="again" type="password" autocomplete="new-password" minlength="12" required>
      <button id="go" class="block" type="submit">SAVE NEW PASSWORD</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
    <p class="hint"><a href="/">Back to the portal</a></p>
  </div>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/change-password.js"></script>
</body>
</html>
