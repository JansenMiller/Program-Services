<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in &middot; ADOC Staff Portal</title>
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body>
<main class="narrow">
  <div id="logo" style="color:var(--ranger-green);width:260px;margin:0 auto 26px"></div>
  <div class="panel">
    <h1>Staff sign in</h1>
    <p class="sub">Program Services staff portal. Authorized ADOC staff only.</p>
    <form id="f" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="go" class="block" type="submit">SIGN IN</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
    <p class="hint">Need an account or a password reset? Contact your Program Services supervisor.</p>
  </div>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
