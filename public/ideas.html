<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4F4F40">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Shortcut Ideas &middot; ADOC Staff Portal</title>
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body>
<header id="site-header" class="site"></header>
<section class="hero compact">
  <div class="in">
    <a class="back" href="/">&larr; Portal home</a>
    <h1>Shortcut ideas</h1>
    <p class="lead">Something that eats up your time and happens over and over? Tell us. Please leave out names, AIS numbers and other details about specific people.</p>
  </div>
</section>
<main class="page">
  <div class="lift split">
    <section class="panel rise">
      <h2>Submit an idea</h2>
      <form id="f">
        <label for="title">What is the task?</label>
        <input id="title" name="title" maxlength="120" required placeholder="e.g. Typing up class rosters every month">
        <label for="details">How do you do it today, and how long does it take?</label>
        <textarea id="details" name="details" maxlength="2000"></textarea>
        <button type="submit" class="block">Send idea</button>
        <div id="msg" class="msg" role="alert"></div>
      </form>
    </section>
    <section class="panel rise" style="--i:1">
      <h2 id="list-title">Your ideas</h2>
      <div id="list" class="ideas"></div>
    </section>
  </div>
</main>
<script src="/assets/app.js"></script>
<script src="/ideas.js"></script>
</body>
</html>
