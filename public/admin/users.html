<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manage Team &middot; ADOC Staff Portal</title>
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <p class="crumb"><a href="/">&larr; Portal home</a></p>
  <h1>Manage Team</h1>
  <p class="sub">Add staff, choose what they can see, and reset or turn off accounts. New accounts get a one-time temporary password that must be changed at first sign-in.</p>
  <section class="panel">
    <h2>Add a person</h2>
    <form id="f">
      <div class="row">
        <div><label for="name">Name</label><input id="name" name="name" required maxlength="80"></div>
        <div><label for="email">Work email</label><input id="email" name="email" type="email" required></div>
      </div>
      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="caseworker">Social Service Caseworker</option>
        <option value="chaplain">Chaplain</option>
        <option value="supervisor">Supervisor (Central Office)</option>
      </select>
      <button type="submit">CREATE ACCOUNT</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
    <div id="temp" class="tempbox" hidden></div>
  </section>
  <section class="panel">
    <h2>Team</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last sign-in</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>
<script src="/assets/app.js"></script>
<script src="/admin/users.js"></script>
</body>
</html>
